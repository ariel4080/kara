name: kara
description: "Practice project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 2.3.5+11

environment:
  sdk: ^3.8.0
  flutter: ^3.29.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: 1.19.1
  device_info_plus: ^13.1.0
  equatable: ^2.0.8
  flutter_native_splash: ^2.4.7
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  shared_preferences: ^2.5.5
  yaml: ^3.1.2
  go_router: ^17.2.3
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  dio: ^5.9.2
  retrofit: ^4.9.2
  json_annotation: ^4.11.0
  flutter_dotenv: ^6.0.1
  google_sign_in: ^6.2.1
  freezed_annotation: ^3.1.0
  flutter_svg: ^2.2.4
  intl: ^0.20.2
  package_info_plus: ^10.1.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  melos: ^7.5.1
  mockito: ^5.6.4
  retrofit_generator: ^10.2.5
  test: any
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/signin-assets/Android/svg/light/android_light_sq_na.svg
    - assets/icons/construction.png
    - assets/icons/kara_launcher.png
    - assets/icons/packages.png
    - assets/icons/thinking.png
    - assets/icons/warning.png
    - assets/icons/what.png
    - assets/icons/working.png

flutter_launcher_icons:
  image_path: "assets/icons/kara_launcher.png"
  adaptive_icon_background: "0xFF420296"
  ios: true
  android: true